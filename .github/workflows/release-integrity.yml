name: release-integrity

on:
  pull_request:
  push:
    branches:
      - release/v0.1.0-zenodo
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install cffconvert

      - name: Validate repository structure
        run: python scripts/00_phase0_check.py

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: Validate Zenodo JSON
        run: python -m json.tool .zenodo.json > /dev/null

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Compile preprint twice in a clean directory
        run: |
          mkdir -p /tmp/tasknet-elu-build
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=/tmp/tasknet-elu-build \
            paper/TaskNet-ELU-preprint-v0.1.0.tex
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=/tmp/tasknet-elu-build \
            paper/TaskNet-ELU-preprint-v0.1.0.tex
          test -s /tmp/tasknet-elu-build/TaskNet-ELU-preprint-v0.1.0.pdf

      - name: Generate deterministic manifest
        run: python scripts/05_verify_release.py --write-manifest

      - name: Verify release claims and manifest
        run: python scripts/05_verify_release.py --check

      - name: Commit refreshed manifest on the release branch
        if: github.ref_name == 'release/v0.1.0-zenodo' || github.head_ref == 'release/v0.1.0-zenodo'
        run: |
          if git diff --quiet -- release/MANIFEST.sha256; then
            echo "Manifest already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release/MANIFEST.sha256
            git commit -m "chore(release): refresh SHA-256 manifest [skip ci]"
            git push origin HEAD:release/v0.1.0-zenodo
          fi

      - name: Ensure validation leaves repository clean
        run: git diff --exit-code
